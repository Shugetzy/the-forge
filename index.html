<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE FORGE — BT Focal Immersive Training & Certification Program</title>
<style>
:root{
  --char-950:#2e4d6b; --char-900:#3a5d82;
  --char-850:#4c74a1; --char-800:#5a86b6; --char-700:#6a98c9;
  --ember-500:#00c2ff; --ember-400:#5cdcff; --ember-glow:#c8f6ff;
  --molten-600:#0a4d99; --molten-500:#1c78d1;
  --brass-400:#ffcf4d; --brass-500:#e8a415; --gold-400:#ffe066;
  --steel-300:#eaf3fa; --steel-500:#a8c0d8; --steel-700:#6684a3;
  --text-hi:#ffffff; --text-mid:#d6e6f3; --text-low:#9db8cf;
  --green-400:#4be0a0; --red-400:#ff5c5c; --amber-400:#ffb347;
  --ice-400:#6cc6ff;
  --border-glow:rgba(0,194,255,0.55);
  --font-display:'Sora','Segoe UI',sans-serif; --font-body:'Inter','Segoe UI',sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--char-950);color:var(--text-hi);font-family:var(--font-body);
  background-image:
    radial-gradient(ellipse at 50% 30%, transparent 30%, rgba(6,14,26,0.55) 100%),
    radial-gradient(circle at 15% 5%, rgba(0,194,255,0.35), transparent 38%),
    radial-gradient(circle at 85% 78%, rgba(255,224,102,0.14), transparent 40%);
  background-attachment:fixed; min-height:100vh;
}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; font-weight:700; letter-spacing:-0.01em;}
p{margin:0;} a{color:inherit;} button{font-family:var(--font-body); cursor:pointer;}
::-webkit-scrollbar{width:8px; height:8px;} ::-webkit-scrollbar-thumb{background:var(--molten-500); border-radius:4px;}
.wrap{max-width:1180px; margin:0 auto; padding:0 24px;}
.glass{
  background:linear-gradient(165deg, #6a98c9 0%, #4c74a1 16%, #2f4f7d 55%, #22385c 100%);
  border:1px solid rgba(140,215,255,0.4); border-radius:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.35), 0 8px 28px rgba(0,0,0,0.45);
}
.glow-border{border:1px solid var(--border-glow); box-shadow:inset 0 1px 0 rgba(255,255,255,0.3), 0 0 0 1px rgba(0,194,255,0.18), 0 0 30px rgba(0,194,255,0.35);}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 26px; border-radius:12px; border:none; font-weight:700; font-size:15px; transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease; position:relative;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:linear-gradient(135deg, var(--ember-400) 0%, var(--ember-500) 35%, var(--molten-500) 70%, var(--ember-500) 100%); color:#fff; box-shadow:inset 0 1px 0 rgba(255,255,255,0.5), 0 6px 22px rgba(0,194,255,0.55);}
.btn-primary:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,0.6), 0 8px 30px rgba(0,194,255,0.7);}
.btn-gold{background:linear-gradient(135deg, #fff0b8 0%, var(--gold-400) 30%, var(--brass-500) 70%, var(--gold-400) 100%); color:#2b1c00; box-shadow:inset 0 1px 0 rgba(255,255,255,0.6), 0 6px 22px rgba(255,224,102,0.55);}
.btn-ghost{background:linear-gradient(160deg, rgba(255,255,255,0.20), rgba(255,255,255,0.06)); color:var(--text-hi); border:1px solid rgba(140,215,255,0.45); box-shadow:inset 0 1px 0 rgba(255,255,255,0.3);}
.btn-ghost:hover{background:linear-gradient(160deg, rgba(255,255,255,0.28), rgba(255,255,255,0.1));}
.btn-danger{background:linear-gradient(135deg, #ff8a8a, #ff5c5c 60%, #e63d3d); color:#fff; box-shadow:inset 0 1px 0 rgba(255,255,255,0.4), 0 6px 20px rgba(255,92,92,0.4);}
.btn-sm{padding:8px 14px; font-size:13px; border-radius:9px;}
.btn:disabled{opacity:0.4; cursor:not-allowed;}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:100px; font-size:12px; font-weight:600;}
.pill-track{background:rgba(95,209,138,0.14); color:var(--green-400); border:1px solid rgba(95,209,138,0.35);}
.pill-attention{background:rgba(255,179,71,0.14); color:var(--amber-400); border:1px solid rgba(255,179,71,0.35);}
.pill-risk{background:rgba(255,92,92,0.14); color:var(--red-400); border:1px solid rgba(255,92,92,0.35);}
.pill-locked{background:rgba(143,168,189,0.14); color:var(--text-low); border:1px solid rgba(143,168,189,0.3);}
.progress-track{width:100%; height:10px; border-radius:100px; background:rgba(255,255,255,0.06); overflow:hidden;}
.progress-fill{height:100%; border-radius:100px; background:linear-gradient(90deg,#7a2c14,var(--molten-500),var(--ember-400)); transition:width .6s cubic-bezier(.2,.8,.2,1);}
.progress-fill.gold{background:linear-gradient(90deg,var(--brass-500),var(--gold-400));}
input,textarea,select{width:100%; background:rgba(255,255,255,0.04); border:1px solid rgba(108,198,255,0.22); color:var(--text-hi); padding:11px 14px; border-radius:9px; font-size:14px; font-family:var(--font-body);}
input::placeholder,textarea::placeholder{color:var(--text-low); opacity:1;}
select{ color-scheme: dark; } select option{ background:var(--char-850); color:var(--text-hi); }
input:focus,textarea:focus,select:focus{outline:none; border-color:var(--ember-500); box-shadow:0 0 0 3px rgba(47,160,255,0.22);}
label{display:block; font-size:12px; color:var(--text-mid); margin-bottom:6px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em;}
.field{margin-bottom:16px;}
table{width:100%; border-collapse:collapse; font-size:14px;}
th{text-align:left; padding:10px 14px; color:var(--text-low); font-size:11px; text-transform:uppercase; letter-spacing:0.05em; border-bottom:1px solid rgba(108,198,255,0.14);}
td{padding:12px 14px; border-bottom:1px solid rgba(255,255,255,0.05);}
tr.row-clickable:hover{background:rgba(47,160,255,0.07); cursor:pointer;}
.avatar{width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;}
.grid{display:grid; gap:16px;} .g2{grid-template-columns:repeat(2,1fr);} .g3{grid-template-columns:repeat(3,1fr);} .g4{grid-template-columns:repeat(4,1fr);} .g5{grid-template-columns:repeat(5,1fr);}
@media(max-width:900px){.g3,.g4,.g5{grid-template-columns:repeat(2,1fr);} }
@media(max-width:600px){.g2,.g3,.g4,.g5{grid-template-columns:1fr;} }
.badge-icon{width:64px;height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 10px;}
.badge-locked{filter:grayscale(1); opacity:0.35;}
.badge-unlocked{background:linear-gradient(145deg,rgba(240,198,116,0.22),rgba(196,138,58,0.08)); box-shadow:0 0 20px rgba(240,198,116,0.30); border:1px solid rgba(240,198,116,0.5);}
.toast-stack{position:fixed; top:20px; right:20px; z-index:9999; display:flex; flex-direction:column; gap:10px;}
.toast{padding:16px 20px; border-radius:12px; min-width:260px; animation:toastin .35s ease;}
@keyframes toastin{from{opacity:0; transform:translateX(30px);} to{opacity:1; transform:translateX(0);}}
.modal-overlay{position:fixed; inset:0; background:rgba(6,4,2,0.78); backdrop-filter:blur(3px); z-index:200; display:flex; align-items:flex-start; justify-content:center; overflow-y:auto; padding:40px 16px;}
.modal-box{max-width:640px; width:100%; margin-top:20px;}
.tabbar{display:flex; gap:4px; overflow-x:auto; padding-bottom:2px;}
.tab{padding:10px 16px; border-radius:9px; font-size:13px; font-weight:600; color:var(--text-mid); white-space:nowrap; border:1px solid transparent;}
.tab.active{background:rgba(47,160,255,0.16); color:#fff; border-color:rgba(47,160,255,0.4);}
.tab:hover:not(.active){background:rgba(255,255,255,0.04); color:var(--text-hi);}
.forge-node{display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0; flex:1 1 0; max-width:110px;}
.node-circle{width:clamp(40px,7vw,64px);height:clamp(40px,7vw,64px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(15px,2.6vw,26px); position:relative; flex-shrink:0;}
.node-done{background:linear-gradient(145deg,var(--green-400),#1f7a4a); box-shadow:0 0 22px rgba(95,209,138,0.45);}
.node-current{background:linear-gradient(145deg,var(--ember-500),var(--molten-500)); box-shadow:0 0 28px rgba(47,160,255,0.65); animation:pulse 2.2s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 20px rgba(47,160,255,0.5);}50%{box-shadow:0 0 34px rgba(47,160,255,0.85);}}
@keyframes mascotBreathe{0%,100%{transform:scale(1);}50%{transform:scale(1.015);}}
@keyframes mascotGlow{0%,100%{filter:drop-shadow(-40px 10px 26px rgba(255,140,40,0.45)) drop-shadow(40px 10px 26px rgba(0,194,255,0.4));}50%{filter:drop-shadow(-40px 10px 34px rgba(255,140,40,0.65)) drop-shadow(40px 10px 34px rgba(0,194,255,0.6));}}
@keyframes emberRise{0%{transform:translate(0,0) scale(0.8); opacity:0;}15%{opacity:1;}80%{opacity:0.8;}100%{transform:translate(var(--dx,6px),-38px) scale(1.1); opacity:0;}}
@keyframes iceDrift{0%{transform:translate(0,0) rotate(0deg) scale(0.85); opacity:0;}15%{opacity:1;}80%{opacity:0.9;}100%{transform:translate(var(--dx,-6px),-30px) rotate(25deg) scale(1); opacity:0;}}
.mascot-particle{position:absolute; pointer-events:none; border-radius:50%;}
.node-locked{background:rgba(255,255,255,0.05); border:1px dashed rgba(108,198,255,0.25); color:var(--text-low);}
.gate-marker{width:clamp(28px,5vw,44px);height:clamp(28px,5vw,44px);border-radius:10px; background:linear-gradient(145deg,var(--gold-400),var(--brass-500)); display:flex;align-items:center;justify-content:center;font-size:clamp(13px,2vw,20px); box-shadow:0 0 18px rgba(240,198,116,0.45); flex-shrink:0;}
.gate-marker.locked{background:rgba(255,255,255,0.06); box-shadow:none; color:var(--text-low);}
.gate-marker.failed{background:linear-gradient(145deg,var(--red-400),#7a1f1f);}
.scrollx{display:flex; align-items:center; overflow-x:hidden; flex-wrap:wrap; justify-content:center; padding:20px 8px; gap:6px 2px; row-gap:18px;}
.connector{width:clamp(8px,2vw,28px); height:2px; background:linear-gradient(90deg,rgba(108,198,255,0.3),rgba(108,198,255,0.05)); flex-shrink:0;}
.mission-card{padding:20px; display:flex; flex-direction:column; gap:12px;}
.status-dot{width:8px;height:8px;border-radius:50%; display:inline-block;}
.certified-banner{background:linear-gradient(135deg, rgba(240,198,116,0.16), rgba(47,160,255,0.18)); border:1px solid rgba(240,198,116,0.4);}
.divider{height:1px; background:rgba(108,198,255,0.14); margin:20px 0;}
.small-muted{font-size:12.5px; color:var(--text-low);}
.stat-num{font-family:var(--font-display); font-weight:700; font-size:30px;}
.navlink{padding:9px 14px; border-radius:9px; font-size:13.5px; font-weight:600; color:var(--text-mid); white-space:nowrap;}
.navlink.active{background:rgba(47,160,255,0.18); color:#fff;}
</style>
</head>

const SP_SITE    = 'https://ts.accenture.com/sites/KLMETASharepoint';
const SP_LIST    = 'ForgeDB';
const SP_ITEM_ID = 1;
const SP_COL     = 'DBData';

async function spGetDigest(){
  const r = await fetch(`${SP_SITE}/_api/contextinfo`, {
    method:'POST', headers:{'Accept':'application/json;odata=nometadata','Content-Type':'application/json'}
  });
  if(!r.ok) throw new Error('contextinfo failed: '+r.status);
  const j = await r.json();
  return j.FormDigestValue;
}

const _storage = {
  get: async () => {
    const r = await fetch(
      `${SP_SITE}/_api/web/lists/getbytitle('${SP_LIST}')/items(${SP_ITEM_ID})?$select=${SP_COL}`,
      { headers:{ 'Accept':'application/json;odata=nometadata' } }
    );
    if(!r.ok) throw new Error('SP read failed: '+r.status);
    const j = await r.json();
    const v = j[SP_COL];
    return v ? { key: STORAGE_KEY, value: v, shared: true } : null;
  },
  set: async (key, value) => {
    const digest = await spGetDigest();
    const r = await fetch(
      `${SP_SITE}/_api/web/lists/getbytitle('${SP_LIST}')/items(${SP_ITEM_ID})`,
      {
        method: 'POST',
        headers: {
          'Accept':           'application/json;odata=nometadata',
          'Content-Type':     'application/json;odata=nometadata',
          'X-RequestDigest':  digest,
          'X-HTTP-Method':    'MERGE',
          'IF-MATCH':         '*'
        },
        body: JSON.stringify({ [SP_COL]: value })
      }
    );
    if(!r.ok && r.status !== 204) throw new Error('SP write failed: '+r.status);
    return { key, value, shared: true };
  }
};

const STORAGE_TIMEOUT_MS = 8000;
function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_,reject)=> setTimeout(()=> reject(new Error(label + ' timed out after ' + ms + 'ms')), ms))
  ]);
}
async function loadDB(retriesLeft){
  retriesLeft = retriesLeft===undefined ? 2 : retriesLeft;
  let res;
  try{
    res = await withTimeout(_storage.get(STORAGE_KEY, true), STORAGE_TIMEOUT_MS, 'Storage read');
  }catch(e){
    if(retriesLeft > 0){ await new Promise(r=>setTimeout(r, 900)); return loadDB(retriesLeft-1); }
    return { ok:false, kind:'connection', error:e };
  }
  if(!(res && res.value)) return { ok:true, data:null };
  try{
    lastKnownDBString = res.value;
    return { ok:true, data: JSON.parse(res.value) };
  }catch(parseErr){
    return { ok:false, kind:'parse', error:parseErr, rawLength: res.value.length };
  }
}
async function saveDB(){
  const str = JSON.stringify(DB);
  try{
    await withTimeout(_storage.set(STORAGE_KEY, str, true), STORAGE_TIMEOUT_MS, 'Storage save');
    lastKnownDBString = str;
  }catch(e){
    console.error('Storage save failed, retrying once', e);
    try{
      await new Promise(r=>setTimeout(r, 1200));
      await withTimeout(_storage.set(STORAGE_KEY, str, true), STORAGE_TIMEOUT_MS, 'Storage save (retry)');
      lastKnownDBString = str;
    }catch(e2){
      console.error('Storage save failed on retry too', e2);
      pushToast('⚠️ Save may have failed', 'Your last change might not be saved — try the action again, or refresh and check.', 'danger');
    }
  }
}
async function pullRemoteChanges(){
  const active = document.activeElement;
  const isTyping = active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName);
  const modalOpen = document.querySelector('.modal-overlay');
  if(isTyping || modalOpen) return;
  try{
    const res = await withTimeout(_storage.get(STORAGE_KEY, true), STORAGE_TIMEOUT_MS, 'Background sync');
    if(res && res.value && res.value !== lastKnownDBString){
      lastKnownDBString = res.value;
      DB = JSON.parse(res.value);
      renderApp();
    }
  }catch(e){ /* silent */ }
}
async function manualSync(){
  try{
    const res = await withTimeout(_storage.get(STORAGE_KEY, true), STORAGE_TIMEOUT_MS, 'Manual sync');
    if(res && res.value){ lastKnownDBString = res.value; DB = JSON.parse(res.value); renderApp(); pushToast('Synced', 'Loaded the latest cohort data', 'primary'); }

}

/* ===================== BUSINESS LOGIC ===================== */
function getActivityCompletion(pid, activityId){ return DB.activityCompletions.find(c=>c.participantId===pid && c.activityId===activityId); }
function isActivityComplete(pid, activityId){ const c = getActivityCompletion(pid, activityId); return !!(c && c.status==='completed'); }
function pillarActivitiesComplete(pid, pillarId){
  const acts = PILLARS[pillarId].activities.filter(a=>a.required!==false);
  return acts.every(a=>isActivityComplete(pid,a.id));
}
function getTollgateStatus(pid, pillarId){
  const attempts = DB.tollgateAttempts.filter(a=>a.participantId===pid && a.pillarId===pillarId).sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!attempts.length) return { attempted:false, passed:false, pendingReview:false, latest:null };
  return { attempted:true, passed: attempts[0].status==='passed', pendingReview: attempts[0].status==='submitted', latest: attempts[0], attempts };
}
function isPillarComplete(pid, pillarId){
  if(!pillarActivitiesComplete(pid,pillarId)) return false;
  const pillar = PILLARS[pillarId];
  if(pillar.tollgate) return getTollgateStatus(pid, pillarId).passed;
  return true;
}
function isPillarUnlocked(pid, pillarId){
  // Core pillars (JTRO, DE 2.0, Automation, Innovation) are accessible in parallel —
  // a Focal can work JTRO and DE 2.0 activities side by side without finishing either's
  // Output/Toll Gate first. Badge release still requires that specific pillar's own
  // activities + Toll Gate to be fully approved (see isPillarComplete). Only Extra
  // Elevation (Yellow Belt / LSSYB) stays gated behind full FORGED certification.
  return true;
}
function getCurrentPillar(pid){
  for(const p of PILLAR_ORDER){ if(!isPillarComplete(pid,p)) return p; }
  return null; // all core pillars done
}
function getNextActivity(pid){
  const pillarId = getCurrentPillar(pid);
  if(!pillarId) return null;
  const next = PILLARS[pillarId].activities.find(a=>!isActivityComplete(pid,a.id));
  return next ? { pillarId, activity: next } : null;
}
function calculateXP(pid){ return DB.xpTransactions.filter(t=>t.participantId===pid).reduce((s,t)=>s+t.xp,0); }
function calculateLevel(xp){
  let current = CONFIG.LEVELS[0];
  for(const lvl of CONFIG.LEVELS){ if(xp>=lvl.minXp) current = lvl; }
  const idx = CONFIG.LEVELS.indexOf(current); const next = CONFIG.LEVELS[idx+1] || null;
  return { current, next, xpToNext: next ? next.minXp - xp : 0 };
}
function getAttendanceCount(pid){ return DB.attendanceRecords.filter(a=>a.participantId===pid).length; }
function isAnvilBound(pid){ return getAttendanceCount(pid) >= CONFIG.ANVIL_BOUND_THRESHOLD; }
function isForged(pid){
  return PILLAR_ORDER.filter(p=>PILLARS[p].tollgate).every(p=>getTollgateStatus(pid,p).passed) && isAnvilBound(pid);
}
function calculateProgress(pid){
  // Weighted by relative pillar size (activity count as proxy) across core pillars + governance
  let totalUnits = 0, doneUnits = 0;
  PILLAR_ORDER.forEach(p=>{
    const acts = PILLARS[p].activities.filter(a=>a.required!==false);
    const weight = acts.length + (PILLARS[p].tollgate?1:0);
    totalUnits += weight;
    const doneActs = acts.filter(a=>isActivityComplete(pid,a.id)).length;
    doneUnits += doneActs + (PILLARS[p].tollgate && getTollgateStatus(pid,p).passed ? 1 : 0);
  });
  totalUnits += 1; doneUnits += Math.min(1, getAttendanceCount(pid)/CONFIG.ANVIL_BOUND_THRESHOLD);
  return Math.round((doneUnits/totalUnits)*100);
}
function getYBModuleCompletion(pid, moduleId){ return DB.ybCompletions.find(c=>c.participantId===pid && c.moduleId===moduleId); }
function isYBModuleComplete(pid, moduleId){ const c = getYBModuleCompletion(pid,moduleId); return !!(c && c.status==='completed'); }
function getYBKnowledgeCheckStatus(pid){
  const attempts = DB.ybKnowledgeCheck.filter(k=>k.participantId===pid).sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!attempts.length) return { attempted:false, passed:false, pendingReview:false, latest:null };
  return { attempted:true, passed:attempts[0].status==='passed', pendingReview:attempts[0].status==='submitted', latest:attempts[0] };

function calculateStreak(pid){
  const acts = DB.activities.filter(a=>a.participantId===pid);
  if(!acts.length) return 0;
  const startDate = new Date(CONFIG.PROGRAM_START_DATE);
  const weekOf = (ts)=> Math.floor(daysBetween(startDate, new Date(ts)) / 7);
  const nowWeek = weekOf(new Date());
  const weeksWithActivity = new Set(acts.map(a=>weekOf(a.timestamp)));
  let streak = 0, w = nowWeek;
  while(weeksWithActivity.has(w)){ streak++; w--; }
  return streak;
}
function getParticipantStatus(pid){
  const p = DB.participants.find(x=>x.id===pid);
  const daysSinceActivity = daysBetween(new Date(p.lastActivity), new Date());
  const reasons = []; let status = 'on-track';
  if(daysSinceActivity >= CONFIG.AT_RISK_INACTIVITY_DAYS){ status='at-risk'; reasons.push('No activity for ' + daysSinceActivity + ' days'); }
  const pillarId = getCurrentPillar(pid);
  if(pillarId && PILLARS[pillarId].tollgate){
    const tgStatus = getTollgateStatus(pid, pillarId);
    if(tgStatus.attempted && !tgStatus.passed && !tgStatus.pendingReview){ status = status==='at-risk'?status:'needs-attention'; reasons.push('Toll Gate not passed — retry needed'); }
  }
  if(status==='on-track' && daysSinceActivity>=3) { status='needs-attention'; reasons.push('No activity for ' + daysSinceActivity + ' days'); }
  return { status: (reasons.length? status : 'on-track'), reasons, daysSinceActivity };
}
function calculateCohortProgress(){
  const ps = DB.participants; if(!ps.length) return { avgProgress:0, avgXp:0 };
  return { avgProgress: Math.round(ps.reduce((s,p)=>s+calculateProgress(p.id),0)/ps.length), avgXp: Math.round(ps.reduce((s,p)=>s+calculateXP(p.id),0)/ps.length) };
}
function calculateLeaderboard(view){
  const rows = DB.participants.map(p=>{
    const xp = calculateXP(p.id); const lvl = calculateLevel(xp); const badges = getUnlockedBadgeIds(p.id).length;
    const progress = calculateProgress(p.id); const streak = calculateStreak(p.id);
    const activitiesCompleted = DB.activityCompletions.filter(c=>c.participantId===p.id && c.status==='completed').length;
    const attendance = getAttendanceCount(p.id);
    return { participant:p, xp, level:lvl.current, badges, progress, streak, activitiesCompleted, attendance };
  });
  const sortKey = { xp:'xp', activities:'activitiesCompleted', streak:'streak', attendance:'attendance' }[view] || 'xp';
  return rows.sort((a,b)=>b[sortKey]-a[sortKey]);
}
function calculateAtRiskParticipants(){ return DB.participants.map(p=>({ participant:p, ...getParticipantStatus(p.id) })).filter(r=>r.status!=='on-track'); }
function calculatePillarWiseProgress(){
  return PILLAR_ORDER.map(p=>{
    const pct = DB.participants.length ? Math.round(DB.participants.filter(x=>isPillarComplete(x.id,p)).length/DB.participants.length*100) : 0;
    return { pillar:p, name:PILLARS[p].name, pct };
  });
}
function calculateTollgateStats(){
  return PILLAR_ORDER.filter(p=>PILLARS[p].tollgate).map(p=>{
    const attempts = DB.tollgateAttempts.filter(a=>a.pillarId===p);
    const pids = [...new Set(attempts.map(a=>a.participantId))];
    const passed = pids.filter(pid=>getTollgateStatus(pid,p).passed).length;
    return { pillar:PILLARS[p], attempted:pids.length, passed, failed:pids.length-passed, totalCohort:DB.participants.length };
  });
}

/* Custom confirm modal — native window.confirm() is blocked/no-op'd inside the artifact
   sandbox, which makes "if(!confirm(...)) return;" silently abort every time. This replaces
   it with an in-app modal that works reliably regardless of environment. */
let PENDING_CONFIRM = null;
function askConfirm(message, onYes){
  PENDING_CONFIRM = { message, onYes };
  renderApp();
}
function resolveConfirm(yes){
  const pending = PENDING_CONFIRM; PENDING_CONFIRM = null;
  if(yes && pending && pending.onYes) pending.onYes();
  else renderApp();
}
function renderConfirmModal(){
  if(!PENDING_CONFIRM) return '';
  return `<div class="modal-overlay" style="z-index:300;" onclick="if(event.target===this) resolveConfirm(false)">
    <div class="modal-box glass glow-border" style="padding:28px; max-width:440px;">
      <p style="line-height:1.5;">${esc(PENDING_CONFIRM.message)}</p>
      <div style="display:flex; gap:12px; margin-top:20px;">
        <button class="btn btn-ghost" style="flex:1;" onclick="resolveConfirm(false)">Cancel</button>
        <button class="btn btn-danger" style="flex:1;" onclick="resolveConfirm(true)">Confirm</button>
      </div>
    </div>
  </div>`;
}

function normalizeNameKey(s){ return (s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
function actionImportAttendanceCSV(rawText, sessionNameDefault){
  const lines = rawText.split('\n').map(l=>l.trim()).filter(Boolean);
  let matched = 0, unmatched = [];
  lines.forEach(line=>{
    const parts = line.split(',').map(s=>s.trim());
    const nameOrEmail = parts[0];

    const date = parts[2] || todayISO();

    const p = DB.participants.find(x=> normalizeNameKey(x.name)===key || (x.email && (normalizeNameKey(x.email)===key || normalizeNameKey(x.email.split('@')[0])===key)));
    if(p){
      DB.attendanceRecords.push({ id:uid('att'), participantId:p.id, sessionName, date, source:'upload' });
      awardXpRaw(DB, p.id, 'governance', 'Attended: ' + sessionName, GOVERNANCE_XP_PER_SESSION);

  return { matched, unmatched };
}

/* ===================== RENDER HELPERS ===================== */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){ return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join(''); }
const AVATAR_PALETTE = [['#1c4e91','#a8d8ff'],['#0f3a66','#8fd0ff'],['#2f5f7a','#bfe3f0'],['#47586b','#c7d6e2'],['#8a5a1e','#f0c674']];
function avatarStyle(name){ let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))>>>0; const [bg,fg]=AVATAR_PALETTE[h%AVATAR_PALETTE.length]; return `background:${bg}33;color:${fg};border:1px solid ${bg}88;`; }
function fmtDate(iso){ if(!iso) return '—'; return new Date(iso).toLocaleDateString('en-GB',{ day:'numeric', month:'short', year:'numeric' }); }
function fmtRelative(iso){ const days = daysBetween(new Date(iso), new Date()); if(days<=0) return 'Today'; if(days===1) return 'Yesterday'; return days + ' days ago'; }
function fmtNum(n){ return Number(n).toLocaleString('en-US'); }
function statusMeta(status){ return { 'on-track':{label:'On track',cls:'pill-track',dot:'var(--green-400)'}, 'needs-attention':{label:'Needs attention',cls:'pill-attention',dot:'var(--amber-400)'}, 'at-risk':{label:'At risk',cls:'pill-risk',dot:'var(--red-400)'} }[status]; }
function statusPillHtml(status){ const m=statusMeta(status); return `<span class="pill ${m.cls}"><span class="status-dot" style="background:${m.dot}"></span>${m.label}</span>`; }
function progressBarHtml(pct, gold){ return `<div class="progress-track"><div class="progress-fill ${gold?'gold':''}" style="width:${Math.max(0,Math.min(100,pct))}%"></div></div>`; }
function iconForType(type){ return { theoretical:'📘', experiential:'🧭', output:'🛠', reflection:'📝' }[type] || '•'; }

function renderToasts(){
  const el = document.getElementById('toast-stack'); if(!el) return;
  el.innerHTML = TOASTS.map(t=>`<div class="toast glass ${t.tone==='gold'?'glow-border':''}" style="border-left:3px solid ${t.tone==='gold'?'var(--gold-400)':t.tone==='danger'?'var(--red-400)':'var(--ember-500)'}">
    <div style="font-weight:700; font-size:14px;">${esc(t.title)}</div><div class="small-muted" style="margin-top:2px;">${esc(t.sub)}</div></div>`).join('');
}

  const pin = document.getElementById('onboard-pin').value.trim();
  if(!/^\d{4}$/.test(pin)){ pushToast('Invalid PIN','Enter exactly 4 digits.','danger'); return; }
  if(isClaim){
    const confirmPin = document.getElementById('onboard-pin-confirm').value.trim();
    if(pin !== confirmPin){ pushToast('PINs do not match','Re-enter your PIN to confirm.','danger'); return; }
    actionClaimPin(pid, pin);
  } else {

  }
}

const ACTIVITY_TYPE_LABELS = { theoretical:'Theoretical Learning', experiential:'Experiential Learning', output:'Output', reflection:'Participant Reflection (Optional)' };
function groupActivitiesByType(activities){
  const order = ['theoretical','experiential','output','reflection'];
  const groups = {};
  activities.forEach(a=>{ (groups[a.type] = groups[a.type] || []).push(a); });
  return order.filter(t=>groups[t]).map(t=>({ type:t, items:groups[t] }));
}
function curriculumActivityLine(a){
  const linkPart = a.link ? ` — <a href="${esc(a.link)}" target="_blank" rel="noopener noreferrer" style="color:var(--ember-400); text-decoration:none;">${esc(a.source||'Open link')} ↗</a>`
    : (a.source ? ` — <span class="small-muted">${esc(a.source)}</span>` : '');
  return `<li style="margin-bottom:8px; line-height:1.5;">${esc(a.title)}${linkPart} <span class="small-muted">(${a.minutes}mins${a.required===false?' · Optional':''} · +${a.xp} XP)</span></li>`;
}
function curriculumPillarBlock(num, pillarId){
  const pillar = PILLARS[pillarId];
  const heading = `${num}. ${esc(pillar.name)}${pillar.fullName?' – '+esc(pillar.fullName):''} (${pillar.hours}) <span class="small-muted">(Platform: ${esc(pillar.platform||'—')})</span>`;
  let body = '';
  if(pillarId === 'launch'){
    body = `<ol style="margin:10px 0 0 20px; padding:0;">${pillar.activities.map(curriculumActivityLine).join('')}</ol>`;
  } else {
    const groups = groupActivitiesByType(pillar.activities);
    body = groups.map(g=>`<div style="margin-top:10px;"><b style="font-size:13.5px;">${ACTIVITY_TYPE_LABELS[g.type]}:</b>
      <ol style="margin:6px 0 0 20px; padding:0;">${g.items.map(curriculumActivityLine).join('')}</ol></div>`).join('');
  }
  const gateNote = pillar.tollgate ? `<p style="margin-top:12px; padding:10px 14px; background:rgba(240,198,116,0.08); border-radius:8px; font-size:13px;"><b>Toll Gate:</b> BT Lead Review &amp; Sign-off → Badge Release (${esc(pillar.badge ? BADGES.find(b=>b.id===pillar.badge).name : '')} badge)</p>` : '';
  return `<div class="glass" style="padding:22px; margin-bottom:16px;"><h3 style="font-size:16px;">${heading}</h3>${body}${gateNote}</div>`;
}

function renderForgePathStrip(pid){
  let html = '<div class="scrollx">';
  PILLAR_ORDER.forEach((p,i)=>{
    const pillar = PILLARS[p];
    let cls='node-locked';
    if(pid){ if(isPillarComplete(pid,p)) cls='node-done'; else if(isPillarUnlocked(pid,p)) cls='node-current'; }
    html += `<div class="forge-node" ${pid?`onclick="openPillarInfo('${p}')" style="cursor:pointer;"`:''}>
      <div class="node-circle ${cls}">${cls==='node-locked' && pid ? '🔒' : pillar.icon}</div>
      <div style="font-size:12.5px; font-weight:600;">${pillar.name}</div><div class="small-muted">${pillar.hours}</div></div>`;
    if(pillar.tollgate){
      const gs = pid ? getTollgateStatus(pid, p) : null;
      const gcls = !pid ? 'locked' : (gs.passed ? '' : (gs.pendingReview ? '' : (gs.attempted?'failed':'locked')));
      html += `<div class="connector"></div><div class="gate-marker ${gcls}" title="${esc(pillar.tollgate.name)}" ${pid?`onclick="openTollgateModal('${p}')" style="cursor:pointer;"`:''}>⚒️</div><div class="connector"></div>`;
    } else if(i < PILLAR_ORDER.length-1){ html += `<div class="connector"></div>`; }
  });
  html += `<div class="connector"></div><div class="forge-node" ${pid?`onclick="setParticipantView('passport')" style="cursor:pointer;"`:''}>
    <div class="node-circle ${pid && isForged(pid) ? 'node-done' : 'node-locked'}" style="width:clamp(52px,9vw,84px);height:clamp(52px,9vw,84px);font-size:clamp(20px,3.4vw,34px);">⚔️</div>
    <div style="font-size:13px; font-weight:700;">FORGED</div><div class="small-muted">Certify</div></div>`;
  const ybCls = pid ? (isYellowBeltComplete(pid) ? 'node-done' : (isForged(pid) ? 'node-current' : 'node-locked')) : 'node-locked';
  html += `<div class="connector"></div><div class="forge-node" ${pid?`onclick="setParticipantView('elevation')" style="cursor:pointer;"`:''}>
    <div class="node-circle ${ybCls}">${ybCls==='node-locked' && pid ? '🔒' : yellowBeltIcon(28,'path')}</div><div style="font-size:12.5px; font-weight:600;">Yellow Belt</div><div class="small-muted">Extra Elevation</div></div>`;
  const lssybCls = pid ? (isLSSYBApproved(pid) ? 'node-done' : (isLSSYBUnlocked(pid) ? 'node-current' : 'node-locked')) : 'node-locked';
  html += `<div class="connector"></div><div class="forge-node" ${pid?`onclick="setParticipantView('elevation')" style="cursor:pointer;"`:''}>
    <div class="node-circle ${lssybCls}">${lssybCls==='node-locked' && pid ? '🔒' : '🪓'}</div><div style="font-size:12.5px; font-weight:600;">LSSYB</div><div class="small-muted">Project Completion</div></div>`;
  html += '</div>';
  return html;
}

/* ---- Custom comment modal (replaces blocked window.prompt) ---- */
function showCommentModal(label, placeholder, defaultVal, onConfirm, onCancel){
  const existing = document.getElementById('__comment-modal');
  if(existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.id = '__comment-modal';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `
    <div style="background:var(--char-900,#1a1f2e);border:1px solid rgba(108,198,255,0.3);border-radius:16px;padding:28px;max-width:480px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,0.6);">
      <div style="font-weight:700;font-size:15px;margin-bottom:14px;color:#fff;">${label}</div>
      <textarea id="__comment-input" rows="4" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(108,198,255,0.25);border-radius:10px;padding:10px 12px;color:#fff;font-size:14px;resize:vertical;box-sizing:border-box;" placeholder="${placeholder}">${defaultVal}</textarea>
      <div style="display:flex;gap:10px;margin-top:16px;justify-content:flex-end;">
        <button onclick="document.getElementById('__comment-modal').remove();" style="padding:9px 20px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:#aaa;cursor:pointer;font-size:13px;">Cancel</button>
        <button id="__comment-confirm" style="padding:9px 20px;border-radius:8px;border:none;background:var(--ice-400,#6cc6ff);color:#0a0e1a;font-weight:700;cursor:pointer;font-size:13px;">Confirm</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const input = document.getElementById('__comment-input');
  input.focus(); input.select();
  document.getElementById('__comment-confirm').onclick = () => {
    const val = input.value.trim();
    overlay.remove();
    onConfirm(val);
  };
  if(onCancel) overlay.querySelector('button').onclick = () => { overlay.remove(); onCancel(); };
}

/* ===================== MAIN RENDER DISPATCHER ===================== */
function renderApp(){
  const root = document.getElementById('app');
  if(!DB){ root.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#c9bdac;">Lighting the forge…</div>'; return; }
  let html = '';
  if(!SESSION.mode){ html = screenLanding(); }
  else if(SESSION.mode==='participant-select'){ html = `<div class="wrap">${screenParticipantOnboarding()}</div>`; }
  else if(SESSION.mode==='admin-login'){ html = screenAdminLogin(); }
  else if(SESSION.mode==='participant'){
    const views = { dashboard:screenParticipantDashboard, forgepath:screenParticipantForgePath, curriculum:screenCurriculum, activities:screenParticipantActivities,
      badges:screenParticipantBadges, tollgates:screenParticipantTollgates, leaderboard:screenParticipantLeaderboard, elevation:screenParticipantElevation, passport:screenParticipantPassport };
    html = participantShell((views[SESSION.participantView]||screenParticipantDashboard)());
  } else if(SESSION.mode==='admin'){
    const views = { 'command-center':screenAdminCommandCenter, reviews:screenAdminReviews, focals:screenAdminFocals, forgepath:screenAdminForgePath,
      curriculum:screenCurriculum, activities:screenAdminActivities, leaderboard:screenAdminLeaderboard, tollgates:screenAdminTollgates, elevation:screenAdminElevation,
      analytics:screenAdminAnalytics, certification:screenAdminCertification };
    html = adminShell((views[SESSION.adminView]||screenAdminCommandCenter)());
  }
  root.innerHTML = `<div id="toast-stack" class="toast-stack"></div>` + html + renderConfirmModal();
  renderToasts();
}

/* ===================== INIT ===================== */
const FORCE_CLEAN_SLATE_VERSION = 'v2026-09-25-real-rollout'; // bump this string to force one more one-time reset later if ever needed
function emptyDB(){
  return { participants:[], activityCompletions:[], xpTransactions:[], participantBadges:[], tollgateAttempts:[], attendanceRecords:[], ybCompletions:[], ybKnowledgeCheck:[], lssybProjects:[], activities:[], _resetVersion: FORCE_CLEAN_SLATE_VERSION };
}
function renderLoadIssueScreen(message, detail){
  document.getElementById('app').innerHTML = `
    <div class="wrap" style="max-width:600px; padding-top:100px;">
      <div class="glass glow-border" style="padding:34px; text-align:center;">
        <div style="font-size:30px;">⚠️</div>
        <h2 style="font-size:20px; margin-top:12px;">Couldn't confirm your cohort data</h2>
        <p style="margin-top:12px; color:var(--text-mid); line-height:1.6;">${esc(message)}</p>
        <p style="margin-top:10px; color:var(--text-mid); line-height:1.6;">This is almost always a brief connection issue, not real data loss. <b>Retry first</b> — do not initialize a new cohort unless you're certain this is genuinely the very first time anyone has used this link.</p>
        ${detail ? `<div class="glass" style="margin-top:16px; padding:12px 14px; text-align:left; font-size:12px; color:var(--text-low); word-break:break-word;"><b>Technical detail (for troubleshooting):</b><br>${esc(detail)}</div>` : ''}
        <button class="btn btn-primary" style="width:100%; margin-top:20px;" onclick="initApp()">🔄 Retry loading</button>
        <button class="btn btn-danger" style="width:100%; margin-top:10px;" onclick="confirmForceEmptyInit()">This really is brand new — initialize an empty cohort</button>
      </div>
    </div>`;
}
function confirmForceEmptyInit(){
  askConfirm('Only do this if you are certain no real cohort data has ever been saved to this link before. If any BT Focal has ever used this link, doing this will erase their progress. Continue?', async ()=>{
    DB = emptyDB(); await saveDB(); renderApp(); setInterval(pullRemoteChanges, SYNC_POLL_MS);
  });
}
async function initApp(){
  document.getElementById('app').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#c9bdac;">Lighting the forge…</div>';
  const result = await loadDB();
  if(!result.ok){
    // A real failure even after retries. NEVER treat this as "safe to initialize empty" —
    // that ambiguity is exactly what caused real cohort data to be wiped once already.
    if(result.kind === 'parse'){
      renderLoadIssueScreen(
        'The saved cohort data was found, but could not be read correctly — it may have become too large or gotten corrupted. This is not a connection issue, so retrying will likely show the same result.',
        'JSON parse failed. Stored value length: ' + result.rawLength + ' characters. Error: ' + (result.error && result.error.message)
      );
    } else {
      renderLoadIssueScreen(
        'The connection to shared storage failed after a few attempts. Your saved cohort data has not been touched — this screen just could not confirm it loaded correctly.',
        (result.error && result.error.message) || String(result.error)
      );
    }
    return;
  }
  const existing = result.data;
  // Check that participants is an array at all (data has been saved before), not its
  // length — a deliberately-cleared empty cohort ([].length === 0) is falsy in JS, and
  // treating that as "nothing saved yet" caused an earlier version of this app to silently
  // re-seed 16 demo BT Focals every time anyone loaded the page after a legitimate reset.
  const hasValidData = existing && Array.isArray(existing.participants) && existing._resetVersion === FORCE_CLEAN_SLATE_VERSION;
  if(hasValidData){
    DB = existing; renderApp(); setInterval(pullRemoteChanges, SYNC_POLL_MS); return;
  }
  // Nothing found — auto-initialize an empty cohort (safe in local/offline context).
  DB = emptyDB(); await saveDB(); renderApp(); setInterval(pullRemoteChanges, SYNC_POLL_MS);
}
initApp();
</script>
